<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffcee6"><title>하얀이 간식먹이기 🎡</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#bce8ff;color:#70546c}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}#app{position:relative;width:100%;height:100dvh;max-width:600px;margin:auto;overflow:hidden;touch-action:none;isolation:isolate;background:#bdeaff}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:max(12px,env(safe-area-inset-top)) 13px auto;display:flex;align-items:flex-start;justify-content:space-between;gap:6px;z-index:2;pointer-events:none}.pill{border:3px solid white;border-radius:24px;background:#fff9f0e8;box-shadow:0 4px 0 #d59db466;color:#78536a;font-weight:900;padding:10px 12px;white-space:nowrap}.hearts{font-size:clamp(16px,4.6vw,26px);letter-spacing:-3px;filter:drop-shadow(0 2px white);white-space:nowrap}.hud button{pointer-events:auto;font-size:22px}.timer{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-weight:900;color:white;text-shadow:0 2px 5px #59648b;font-size:19px}.bottom{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none}.bottom button{pointer-events:auto}.btn{border:0;border-radius:18px;padding:12px 18px;font-weight:900;color:white;background:#87bfdf;box-shadow:0 4px 0 #5599c2}.pink{background:#fa8fae;box-shadow:0 4px 0 #d96c92}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5;background:#3c526060;backdrop-filter:blur(3px)}.panel{width:min(100%,440px);max-height:calc(100dvh - 44px);overflow:auto;border-radius:32px;background:#fffaf0;padding:24px 20px;text-align:center;box-shadow:0 15px 40px #31496966;border:3px solid #fff;color:#775a71}.panel h1{font-size:clamp(24px,6vw,32px);margin:5px 0 8px;color:#e877a0}.panel p{font-size:14px;line-height:1.55;margin:10px 0}.panel .sub{color:#a18494;font-size:12px}.hero{height:155px;display:flex;align-items:center;justify-content:center}.hero img{height:150px;max-width:95%;object-fit:contain;filter:drop-shadow(0 5px 4px #cbb7c4)}input{border:2px solid #e9c6d8;border-radius:15px;padding:13px 15px;width:100%;background:white;outline-color:#ed96b4;color:#654a5c;font-weight:700;text-align:center}.wide{width:100%;margin:8px 0 3px}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.tab{border:2px solid #eac8d7;border-radius:14px;background:white;color:#90667b;padding:9px;font-weight:800}.tab.active{background:#f8c9dc}.lookbar{display:flex;align-items:center;justify-content:center;gap:15px}.lookbar button{border:0;background:#f4e4e8;border-radius:50%;width:38px;height:38px;font-size:20px;color:#93647c}.lookbar img{height:140px;width:135px;object-fit:contain;border-radius:16px}.ranking{margin:12px 0;max-height:260px;overflow:auto;text-align:left}.rankline{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:10px 8px;border-bottom:1px solid #f1dce3;font-size:14px}.rankline strong{color:#d96695}.notice{font-size:12px;color:#9b788c}.hidden{display:none!important}.badge{display:inline-block;background:#fff1c7;border-radius:12px;padding:5px 9px;font-size:12px}.sound{position:absolute;right:14px;bottom:85px;z-index:3;border:0;border-radius:50%;background:#fff8f0cc;padding:9px}.caption{font-size:12px;color:#fdfaff;text-shadow:0 2px 3px #678;white-space:nowrap}.spinner{animation:bob 1.6s infinite ease-in-out}@keyframes bob{50%{transform:translateY(-5px)}}
</style></head><body><div id="app"><canvas id="stage"></canvas><div class="hud"><div class="pill" id="score">점수 0</div><div class="hearts" id="hearts">💗💗💗💗💗</div><button class="pill" id="home" aria-label="홈으로">🏠</button><div class="timer" id="timer">01:00</div></div><div class="bottom"><button class="btn" id="pause">⏸ 일시정지</button><span class="caption">↔ 화면을 드래그해 이동</span></div><button class="sound" id="sound" aria-label="소리 켜기 끄기">🔊</button><div class="overlay" id="overlay"><section class="panel" id="panel"></section></div></div>
<script src="firebase-config.js"></script><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, setDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d'),panel=$('panel');const foods=[{e:'🍼',p:15},{e:'🥛',p:10},{e:'🧀',p:10},{e:'🍪',p:10},{e:'🍊',p:10},{e:'🥚',p:10}];
let W=0,H=0,dpr=1,mode='menu',nickname=localStorage.getItem('hayani_nick')||'',look=Number(localStorage.getItem('hayani_look')||0),x=.5,score=0,lives=5,remain=60,spawn=0,items=[],particles=[],last=0,keys={},muted=false,board=[],firebaseReady=false,authUser=null,db=null,auth=null,unsub=null,gameId=0;
const foodNames=['bottle','milk','cheese','cookie','tangerine','egg'];const foodIcons=foodNames.map(n=>{const im=new Image();im.src='assets/food_'+n+'.png';return im});
const looks=Array.from({length:10},(_,i)=>'assets/look'+(i+1)+'.png');const chars=Array.from({length:10},(_,i)=>{const im=new Image();im.src='assets/char'+(i+1)+'.png';return im});look=((look%10)+10)%10;const selectedChar=()=>chars[look];const bg=new Image();bg.src='assets/park.svg';
function resize(){const r=$('app').getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function bgDraw(){if(bg.complete&&bg.naturalWidth){const s=Math.max(W/bg.width,H/bg.height),dw=bg.width*s,dh=bg.height*s;ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh)}else{ctx.fillStyle='#9fdaff';ctx.fillRect(0,0,W,H)}}
function draw(){ctx.clearRect(0,0,W,H);bgDraw();const cy=H*.84,px=x*W;for(const a of items){ctx.font=`${Math.max(31,Math.min(46,W*.102))}px 'Apple Color Emoji','Segoe UI Emoji',sans-serif`;ctx.textAlign='center';{const fi=foodIcons[foods.findIndex(f=>f.e===a.e)];const sz=Math.max(38,Math.min(60,W*.13));ctx.globalAlpha=1;if(fi&&fi.complete&&fi.naturalWidth){ctx.drawImage(fi,a.x*W-sz/2,a.y*H-sz/2,sz,sz)}else{ctx.fillText(a.e,a.x*W,a.y*H)}}}ctx.fillStyle='#6e739044';ctx.beginPath();ctx.ellipse(px,cy+Math.min(64,W*.13),Math.min(46,W*.10),10,0,0,7);ctx.fill();const char=selectedChar();if(char.complete&&char.naturalWidth){const ht=Math.min(152,Math.max(98,H*.20)),ww=ht*char.width/char.height;ctx.drawImage(char,px-ww/2,cy-ht*.62,ww,ht)}else{ctx.font='85px sans-serif';ctx.fillText('👧🏻',px,cy)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.font='24px sans-serif';ctx.fillText(p.t,p.x*W,p.y*H);ctx.globalAlpha=1}}
function updateHud(){$('score').textContent='점수 '+score;$('hearts').textContent='💗'.repeat(lives)+'🤍'.repeat(5-lives);const n=Math.ceil(Math.max(0,remain));$('timer').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function sound(f=600){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;const ac=window._hayaniAudio||(window._hayaniAudio=new C());const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.25,ac.currentTime+.09);g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.13);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.14)}catch(e){}}
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000||0));last=t;if(mode==='play'){remain-=dt;spawn+=dt;const speed=.82;if(keys.ArrowLeft||keys.a)x=Math.max(.09,x-speed*dt);if(keys.ArrowRight||keys.d)x=Math.min(.91,x+speed*dt);if(spawn>Math.max(.35,.84-(60-remain)*.006)){spawn=0;const f=foods[Math.floor(Math.random()*foods.length)];items.push({x:.08+Math.random()*.84,y:-.05,e:f.e,p:f.p,v:.24+Math.random()*.08+Math.min(.16,(60-remain)*.003)})}for(let i=items.length-1;i>=0;i--){const a=items[i];a.y+=a.v*dt;if(a.y>=.75&&a.y<=.90&&Math.abs(a.x-x)<.105){items.splice(i,1);score+=a.p;particles.push({x:a.x,y:.74,t:'+'+a.p,life:1});sound(630)}else if(a.y>1.01){items.splice(i,1);lives--;sound(180);if(lives<=0){end();break}}}if(remain<=0&&mode==='play')end();updateHud()}for(let i=particles.length-1;i>=0;i--){particles[i].life-=dt*1.5;particles[i].y-=dt*.12;if(particles[i].life<=0)particles.splice(i,1)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function view(html){panel.innerHTML=html;$('overlay').classList.remove('hidden')};function hide(){$('overlay').classList.add('hidden')};function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function nickInput(){const v=($('nick')?.value||'').trim();if(v.length<2||v.length>12){alert('닉네임은 2~12글자로 입력해 주세요.');return false}nickname=v;localStorage.setItem('hayani_nick',v);return true}
function menu(){mode='menu';view(`<div class="badge">🎡 놀이공원에 오신 걸 환영해요!</div><h1>하얀이 간식먹이기</h1><div class="hero"><img class="spinner" src="${looks[look]}" alt="하얀이"></div><p>🍼 🥛 🧀 🍪 🍊 🥚<br>하늘에서 내려오는 간식을 받아 주세요!<br>60초 동안 최고 점수에 도전해요.</p><input id="nick" maxlength="12" placeholder="닉네임 (2~12글자)" value="${escapeHtml(nickname)}"><button class="btn pink wide" id="choose">캐릭터 고르기 🎀</button><button class="btn wide" id="start">게임 시작 ▶</button><button class="tab wide" id="rank">🏆 전체 최고점 랭킹</button><p class="notice" id="netstatus">${firebaseReady?'🌐 공동 랭킹 연결됨':'📱 체험 모드 · 공동 랭킹 연결 전'}</p>`);$('choose').onclick=()=>{if(nickInput())choose()};$('start').onclick=()=>{if(nickInput())start()};$('rank').onclick=()=>ranking('menu')}
function choose(){mode='choose';view(`<h1>🎀 캐릭터 고르기</h1><p>하얀이 캐릭터를 골라주세요!</p><div class="lookbar"><button id="prev">◀</button><img id="lookimg" src="${looks[look]}" alt="하얀이 캐릭터"><button id="next">▶</button></div><p><b id="looknum">${look+1} / 10</b></p><button class="btn wide" id="done">선택 완료</button><button class="tab wide" id="back">돌아가기</button><p class="sub">선택한 선택한 하얀이 캐릭터가 실제 게임에도 등장해요.</p>`);function change(d){look=(look+d+looks.length)%looks.length;$('lookimg').src=looks[look];$('looknum').textContent=(look+1)+' / 10';localStorage.setItem('hayani_look',look)}$('prev').onclick=()=>change(-1);$('next').onclick=()=>change(1);$('done').onclick=start;$('back').onclick=menu}
function start(){mode='play';score=0;lives=5;remain=60;spawn=0;items=[];particles=[];x=.5;gameId++;hide();updateHud();$('pause').textContent='⏸ 일시정지'}
function pause(){if(mode==='play'){mode='paused';view(`<h1>⏸ 잠깐 쉬는 중</h1><div class="hero"><img src="${looks[look]}"></div><p>현재 <b>${score}점</b>이에요!</p><button class="btn pink wide" id="resume">계속하기</button><button class="tab wide" id="quit">게임 끝내기</button>`);$('resume').onclick=()=>{mode='play';hide()};$('quit').onclick=end}}
async function end(){if(mode==='ended')return;mode='ended';const final=score;let msg=firebaseReady?'점수를 랭킹에 등록하고 있어요…':'체험 모드에서는 이 기기에만 점수가 저장돼요.';view(`<h1>🎉 게임 종료!</h1><div class="hero"><img src="${looks[look]}"></div><p><b>${escapeHtml(nickname)}님</b>의 기록</p><h1>${final.toLocaleString()}점</h1><p id="saved" class="notice">${msg}</p><button class="btn pink wide" id="retry">다시 도전하기</button><button class="btn wide" id="rank">🏆 랭킹 보기</button><button class="tab wide" id="back">홈으로</button>`);$('retry').onclick=start;$('rank').onclick=()=>ranking('ended');$('back').onclick=menu;const bestKey='hayani_best_'+nickname;const prev=Number(localStorage.getItem(bestKey)||0);if(final>prev)localStorage.setItem(bestKey,String(final));if(firebaseReady&&authUser){try{const ref=doc(db,'scores',authUser.uid);const old=await getDoc(ref);if(final>Number(old.exists()?old.data().score:0)){await setDoc(ref,{uid:authUser.uid,nickname,score:final,updatedAt:serverTimestamp()});if(mode==='ended'&&$('saved'))$('saved').textContent='☁️ 최고 점수 등록 완료!'}else if(mode==='ended'&&$('saved'))$('saved').textContent='☁️ 이전 최고 기록을 유지했어요.'}catch(e){if(mode==='ended'&&$('saved'))$('saved').textContent='⚠️ 서버 저장 실패: Firebase 설정 및 권한을 확인해 주세요.'}}}
function ranking(from='menu'){mode='ranking';const grouped=new Map();for(const a of board){const key=(a.nickname||'').trim().toLowerCase();if(!key)continue;if(!grouped.has(key)||grouped.get(key).score<a.score)grouped.set(key,a)}let list=[...grouped.values()].sort((a,b)=>b.score-a.score).slice(0,30);if(!firebaseReady){const k=Number(localStorage.getItem('hayani_best_'+nickname)||0);if(k&&nickname)list=[{nickname,score:k}]}const rows=list.map((a,i)=>`<div class="rankline"><span>${['🥇','🥈','🥉'][i]||i+1+'위'}</span><span>${escapeHtml(a.nickname)}</span><strong>${Number(a.score).toLocaleString()}점</strong></div>`).join('');view(`<h1>🏆 최고점 랭킹</h1><p class="sub">닉네임별 최고 기록 · 최대 30명 표시</p><div class="ranking">${rows||'<p style="text-align:center">아직 등록된 점수가 없어요.<br>첫 번째 주인공이 되어 주세요!</p>'}</div><p class="notice">${firebaseReady?'☁️ 다른 사람의 기록도 자동으로 업데이트돼요.':'⚠️ 현재는 이 기기의 체험 기록만 보여요. Firebase를 연결해야 공동 랭킹이 됩니다.'}</p><button class="btn pink wide" id="back">${from==='ended'?'다시 도전하기':'게임으로 돌아가기'}</button><button class="tab wide" id="menu">처음으로</button>`);$('back').onclick=()=>from==='ended'?start():menu();$('menu').onclick=menu}
$('home').onclick=()=>{if(mode==='play'||mode==='paused'){if(confirm('게임을 종료하고 홈으로 돌아갈까요? 점수는 등록되지 않아요.'))menu()}else menu()};$('pause').onclick=pause;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};function move(clientX){if(mode==='play'){const r=canvas.getBoundingClientRect();x=Math.max(.08,Math.min(.92,(clientX-r.left)/r.width))}}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);move(e.clientX)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
async function connect(){const cfg=window.HAYANI_FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||cfg.apiKey.includes('여기에'))return;try{const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);await signInAnonymously(auth);authUser=auth.currentUser;if(!authUser)throw Error('anonymous sign-in failed');firebaseReady=true;const q=query(collection(db,'scores'),orderBy('score','desc'),limit(150));unsub=onSnapshot(q,snap=>{board=snap.docs.map(d=>d.data());if(mode==='ranking')ranking('menu');if(mode==='menu'&&$('netstatus'))$('netstatus').textContent='🌐 공동 랭킹 연결됨'},err=>{firebaseReady=false;console.error(err)});if(mode==='menu')menu()}catch(e){console.error('Firebase 연결 오류:',e);firebaseReady=false;if(mode==='menu'&&$('netstatus'))$('netstatus').textContent='⚠️ Firebase 연결 실패 · 설정을 확인해 주세요.'}}
menu();connect();
</script></body></html>
